[project]
name = "unit-canon"
version = "0.1.0"
description = "Canon scale for Geometry Nodes and Unreal: meters per grid, deck height, airlock diameter, and the human figure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
unit-canon = "unit_canon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unit_canon = ["canon.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
